name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for f in *.zip; do unzip -o "$f"; done
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          build-root-directory: ViajeOK
      - run: gradle assembleDebug --no-daemon
        working-directory: ViajeOK
      - uses: actions/upload-artifact@v4
        with:
          name: ViajeOK-apk
          path: ViajeOK/app/build/outputs/apk/debug/app-debug.apk
